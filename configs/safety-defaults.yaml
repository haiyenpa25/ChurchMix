# Cấu hình mặc định an toàn cho hệ thống X32 AI Sound Engineer

safety_engine:
  # Mặc định kết nối luôn là Chỉ Đọc
  default_mode: "OBSERVE"
  enforce_read_only_on_connect: true

  # Giới hạn tốc độ gửi lệnh OSC (tránh làm tràn buffer DSP của mixer)
  rate_limit_ms: 20
  readback_timeout_ms: 300
  max_retries_before_rollback: 2

peq_constraints:
  # Giới hạn tăng Gain tối đa cho từng dải EQ (tránh gây hú)
  max_boost_db: 2.0
  max_cut_db: -12.0
  # Quy tắc No-Boost-in-Nulls khi coherence âm học thấp
  coherence_threshold_for_boost: 0.65
  # Q tối thiểu cho notch triệt tiêu hú
  min_notch_q: 5.0
  max_notch_depth_db: -4.5

speech_leveler:
  # Silence Hold: Khóa fader khi người nói tạm dừng, không tăng ồn nền
  silence_hold_delay_s: 0.8
  speech_vad_threshold_dbfs: -42.0
  # Giới hạn tăng fader tự động
  max_upward_step_db: 0.5
  max_downward_step_db: 3.0
  anti_clip_threshold_dbfs: -1.5

talkback_protection:
  # Cổng vật lý DL16 dành cho Talkback ban nhạc (chỉ gửi P16, cấm ra FOH/Matrix)
  dl16_input: 11
  # Kênh X32 đang nhận DL16 input 11. KHÔNG mặc định bằng số cổng DL16 (AGENTS.md #6):
  # kiểm tra trên mixer (Routing > Input) và cập nhật nếu patch thay đổi.
  x32_channel: 11

autopilot:
  # "Lái tự động" (chế độ LIMITED_AUTO). Bật lái tự động = phê duyệt trước cho các điều chỉnh
  # nằm TRONG các giới hạn dưới đây. Ngoài giới hạn: máy chỉ cảnh báo, người quyết định.
  # Bus livestream duy nhất mà máy được phép chỉnh fader (không bao giờ là Main LR).
  livestream_bus: 5
  speech_rider:
    max_offset_db: 3.0        # tối đa ±3 dB quanh mức chuẩn của tiết mục
    step_db: 0.5              # mỗi lần chỉnh tối đa 0,5 dB
    min_interval_s: 2.0       # mỗi kênh tối đa 1 lần chỉnh / 2 giây
    target_level_dbfs: -18.0  # mức giọng nói mong muốn (meter đầu vào)
    deadband_db: 2.0          # lệch dưới 2 dB thì không chỉnh
    speech_threshold_dbfs: -45.0  # dưới ngưỡng này coi là im lặng → giữ nguyên (Silence Hold)
    min_speech_s: 1.5         # phải nói liên tục ít nhất 1,5 giây mới được chỉnh
  auto_notch:
    budget_per_channel: 2     # tối đa 2 lần cắt hẹp / kênh / buổi lễ
    min_confidence: 0.85
    allowed_severities: [MEDIUM, HIGH]   # CRITICAL → hệ thống tự ngắt, người xử lý
  livestream:
    target_lufs: -16.0
    deadband_db: 2.0
    step_db: 0.5
    min_interval_s: 5.0
    max_offset_db: 6.0        # tối đa ±6 dB quanh mức bus lúc bật lái tự động
  clip_watch:
    peak_dbfs: -1.0           # đỉnh từ -1 dBFS trở lên
    frames: 3                 # trong 3/5 khung đo gần nhất → cảnh báo (không tự chỉnh preamp)
